<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DSH Taskboard browser fixture</title>
  <style>html,body,#root{width:100%;height:100%;margin:0}body{background:#f3f4f6}</style>
  <script src="/node_modules/react/umd/react.development.js"></script>
  <script src="/node_modules/react-dom/umd/react-dom.development.js"></script>
  <script>
    window.__modules = {}
    window.__ModuleLoader__ = {
      load(definition) {
        const jsx = (type, props, key) => {
          const { children, ...rest } = props
          return React.createElement(type, { ...rest, ...(key === undefined ? {} : { key }) }, children)
        }
        const jsxs = (type, props, key) => {
          const { children, ...rest } = props
          return React.createElement(type, { ...rest, ...(key === undefined ? {} : { key }) }, ...(Array.isArray(children) ? children : [children]))
        }
        window.__modules[definition.id] = definition.factory(id => {
          if (id === 'react') return React
          if (id === 'react/jsx-runtime') return { Fragment: React.Fragment, jsx, jsxs }
          throw new Error(`fixture cannot require ${id}`)
        })
      },
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="/lib/client.js"></script>
  <script>
    const project = { id:'project-demo', key:'DSH', name:'Native Taskboard', workspaceId:'workspace-local', labels:['local','harness'], nextIssueNumber:8, version:3, createdAt:1, updatedAt:1 }
    const task = (id, identifier, title, status, priority, extra={}) => ({ id, projectId:project.id, identifier, title, description:`## Acceptance\n\n- Verify ${title}\n- Submit evidence`, status, priority, labels:['demo'], sortOrder:Number(identifier.split('-')[1])*1000, creator:'human:demo', version:4, createdAt:Date.now()-60000, updatedAt:Date.now()-60000, ...extra })
    const snapshot = {
      schemaVersion:1, globalRevision:42, projects:[project], refreshIntervalMs:300000,
      automationDefaults:{agentPreset:'standard'},
      storageHealth:{status:'ok',integrity:'ok',schemaVersion:3,globalRevision:42,projectCount:1,taskCount:6,attachmentCount:0,attachmentBytes:0,cleanupPending:0,orphanedClaims:0},
      tasks:[
        task('t1','DSH-1','Implement SQLite authority','todo','urgent',{dueDate:'2026-08-16',recurrence:{frequency:'weekly',interval:1,until:'2026-12-31'}}),
        task('t2','DSH-2','Wire native Agent Session','in_progress','high',{assignee:'agent:worker',startDate:'2026-08-14',dueDate:'2026-08-18'}),
        task('t3','DSH-3','Review attachment security','in_review','medium'),
        task('t4','DSH-4','Wait for workspace decision','blocked','high'),
        task('t5','DSH-5','Ship CLI contract','done','low'),
        task('t6','DSH-6','Future workflow node','backlog','none'),
      ],
      automations:[{id:'auto-1',projectId:project.id,config:{intervalMs:30000,agentPreset:'standard',concurrencyLimit:2,quotaPolicy:'pause-on-uncertain',autoPauseOnEmpty:false},state:'enabled',version:2,nextEligibleAt:Date.now()+60000,lastDecision:{kind:'claimed',taskId:'t2',message:'worker started for DSH-2',at:Date.now()},createdAt:1,updatedAt:1}],
      automationRuns:[
        {id:'run-3',ruleId:'auto-1',decision:{kind:'claimed',taskId:'t2',message:'worker started for DSH-2',at:Date.now()-30000},createdAt:Date.now()-30000},
        {id:'run-2',ruleId:'auto-1',decision:{kind:'empty',message:'no eligible todo tasks',at:Date.now()-90000},createdAt:Date.now()-90000},
        {id:'run-1',ruleId:'auto-1',decision:{kind:'claimed',taskId:'t1',message:'worker started for DSH-1',at:Date.now()-150000},createdAt:Date.now()-150000},
      ],
      workflows:[{id:'wf-1',projectId:project.id,name:'Implement and review',version:2,createdAt:1,updatedAt:1,document:{tabs:[{id:'main',name:'Main',trigger:{id:'trigger',kind:'issue-trigger',execution:'design-only',config:{}},steps:[{id:'tests',kind:'tests',execution:'design-only',config:{}},{id:'review',kind:'review',execution:'design-only',config:{}}]}]}}],
      workflowCatalog:[{kind:'issue-trigger',category:'trigger',execution:'design-only'},{kind:'tests',category:'development',execution:'design-only'},{kind:'review',category:'taskboard',execution:'design-only'},{kind:'skill',category:'capability',execution:'design-only'},{kind:'mcp',category:'capability',execution:'design-only'}],
      workflowCapabilities:{skills:[{name:'manage-taskboard',description:'Manage native Taskboard work'}],mcpTools:[{name:'mcp__github__get_issue',description:'Read a GitHub issue'}],skillDiscoveryComplete:true},
    }
    const workspaceState = {items:[{workspaceId:'workspace-local',title:'DSH-taskboard',path:'/work/taskboard',sessionIds:[],createdAt:'2026-08-14T00:00:00.000Z',updatedAt:'2026-08-14T00:00:00.000Z'}],archivedSessionIds:[],state:'idle',phase:'ready',error:null,baselinesReady:true}
    const workspaces = {list:{getSnapshot:()=>workspaceState,subscribe:()=>()=>{}}}
    const fixtureComments = new Map([['t2',[{id:'c1',taskId:'t2',body:'Verified with the focused test suite.',authorId:'agent:worker',version:1,createdAt:1,updatedAt:1}]]])
    const fixtureClaims = new Map([['t2',{id:'claim-1',taskId:'t2',sessionId:'session-1',agentId:'agent-1',expectedTaskVersion:3,state:'active',claimedAt:1,updatedAt:1}]])
    class FixtureController {
      constructor(){ this.route={open:true,projectId:project.id,view:'board'}; this.listeners=new Set(); this.connectionListeners=new Set(); this.changeWaiters=new Set() }
      subscribe=(listener)=>{this.listeners.add(listener);return()=>this.listeners.delete(listener)}
      getSnapshot=()=>this.route
      select(projectId,view=this.route.view,taskId){this.route={open:true,view,...(projectId?{projectId}:{}),...(taskId?{taskId}:{})};for(const listener of this.listeners)listener()}
      close(){this.route={open:false,view:this.route.view};for(const listener of this.listeners)listener()}
      snapshot(){return Promise.resolve(snapshot)}
      recordSnapshotRevision(revision){this.revision=revision;return 'next'}
      detail(taskId){const selected=snapshot.tasks.find(item=>item.id===taskId);const claim=fixtureClaims.get(taskId);const comments=fixtureComments.get(taskId)||[];return Promise.resolve({task:selected,comments,activities:claim?[{id:`activity-${claim.id}`,taskId,kind:selected.status==='in_review'?'task.review-submitted':'task.claimed',actorKind:'agent',actorId:'agent:fixture',createdAt:Date.now()}]:[],relations:[],attachments:[],claims:claim?[claim]:[],...(claim&&claim.state==='active'?{activeClaim:claim}:{}),sessionRuntime:claim?[{sessionId:claim.sessionId,status:claim.state==='active'?'running':'idle',current:claim.state==='active',todos:[{content:'Run focused tests',status:'completed'},{content:'Submit review',status:selected.status==='in_review'?'completed':'in_progress'}]}]:[],globalRevision:snapshot.globalRevision})}
      subscribeConnection(listener){this.connectionListeners.add(listener);return()=>this.connectionListeners.delete(listener)}
      watchChanges(afterRevision){if(snapshot.globalRevision!==afterRevision)return Promise.resolve({globalRevision:snapshot.globalRevision,changed:true});return new Promise(resolve=>{const waiter={resolve,timer:setTimeout(()=>{this.changeWaiters.delete(waiter);resolve({globalRevision:snapshot.globalRevision,changed:snapshot.globalRevision!==afterRevision})},10000)};this.changeWaiters.add(waiter)})}
      publish(){snapshot.globalRevision+=1;for(const waiter of this.changeWaiters){clearTimeout(waiter.timer);waiter.resolve({globalRevision:snapshot.globalRevision,changed:true})}this.changeWaiters.clear();for(const listener of this.connectionListeners)listener()}
      replaceTask(index,patch){const current=snapshot.tasks[index];const next={...current,...patch,version:current.version+1,updatedAt:Date.now()};snapshot.tasks[index]=next;this.publish();return next}
      runFixtureWorker(taskId){const index=snapshot.tasks.findIndex(item=>item.id===taskId);setTimeout(()=>{const claimed=this.replaceTask(index,{status:'in_progress',assignee:'agent:fixture'});fixtureClaims.set(taskId,{id:`claim-${claimed.version}`,taskId,sessionId:`session-${taskId}-${claimed.version}`,agentId:'agent:fixture',expectedTaskVersion:claimed.version-1,state:'active',claimedAt:Date.now(),updatedAt:Date.now()})},60);setTimeout(()=>{const reviewed=this.replaceTask(index,{status:'in_review'});const claim=fixtureClaims.get(taskId);if(claim)fixtureClaims.set(taskId,{...claim,state:'submitted',updatedAt:Date.now()});const comments=fixtureComments.get(taskId)||[];fixtureComments.set(taskId,[...comments,{id:`comment-${reviewed.version}`,taskId,body:`Fixture worker verification pass for revision ${reviewed.version}.`,authorId:'agent:fixture',version:1,createdAt:Date.now(),updatedAt:Date.now()}])},150)}
      mutate(endpoint,payload){
        const index = snapshot.tasks.findIndex(item=>item.id===payload.taskId)
        if(index>=0 && endpoint==='task.update'){
          const current=snapshot.tasks[index]
          const next={...current,...payload.request,version:current.version+1,updatedAt:Date.now()}
          for(const key of ['startDate','dueDate','recurrence','assignee','workflowId','developmentContext']) if(next[key]===null) delete next[key]
          snapshot.tasks[index]=next; snapshot.globalRevision+=1; return Promise.resolve(next)
        }
        if(index>=0 && endpoint==='task.approve'){
          const next=this.replaceTask(index,{status:'todo'});this.runFixtureWorker(payload.taskId);return Promise.resolve(next)
        }
        if(index>=0 && endpoint==='task.return'){
          const currentComments=fixtureComments.get(payload.taskId)||[];fixtureComments.set(payload.taskId,[...currentComments,{id:`human-${Date.now()}`,taskId:payload.taskId,body:payload.comment,authorId:'human:fixture',version:1,createdAt:Date.now(),updatedAt:Date.now()}]);fixtureClaims.delete(payload.taskId);const next=this.replaceTask(index,{status:'todo',assignee:undefined});this.runFixtureWorker(payload.taskId);return Promise.resolve(next)
        }
        if(index>=0 && endpoint==='task.accept'){
          fixtureClaims.delete(payload.taskId);return Promise.resolve(this.replaceTask(index,{status:'done'}))
        }
        if(index>=0 && endpoint==='task.move'){
          return Promise.resolve(this.replaceTask(index,{status:payload.status,...(payload.sortOrder===undefined?{}:{sortOrder:payload.sortOrder})}))
        }
        if(index>=0 && endpoint==='task.comment'){
          const comments=fixtureComments.get(payload.taskId)||[]
          fixtureComments.set(payload.taskId,[...comments,{id:`comment-${Date.now()}`,taskId:payload.taskId,body:payload.body,authorId:'human:fixture',version:1,createdAt:Date.now(),updatedAt:Date.now()}])
          return Promise.resolve(this.replaceTask(index,{}))
        }
        if(index>=0 && (endpoint==='task.archive'||endpoint==='task.restore')){
          const current=snapshot.tasks[index]
          const next={...current,version:current.version+1,updatedAt:Date.now(),...(endpoint==='task.archive'?{archivedAt:Date.now()}:{})}
          if(endpoint==='task.restore') delete next.archivedAt
          snapshot.tasks[index]=next; snapshot.globalRevision+=1; return Promise.resolve(next)
        }
        return Promise.resolve(null)
      }
      uploadAttachment(){return Promise.resolve()}
      downloadAttachment(){return Promise.resolve()}
      openSession(){}
      openNewSession(){this.createdSessionDraft=true;this.close();return Promise.resolve('session-new')}
    }
    const controller = new FixtureController()
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.__modules['@shengsheng/dsh-taskboard'].TaskboardPage,{controller,workspaces}))
  </script>
</body>
</html>
